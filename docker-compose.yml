# Development database only (no backups; production uses deploy/compose.yml).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmis
      POSTGRES_PASSWORD: hmis_dev_password
      POSTGRES_DB: hmis
    ports:
      # This computer only: with a well-known password, the database must not be reachable from
      # the rest of the network (shared Wi-Fi, the clinic LAN).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
