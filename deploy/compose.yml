# HMIS on a server: HTTPS (Caddy), the web app, the API, PostgreSQL and automatic, encrypted,
# off-site backups. Install with `sudo bash deploy/hmis install` (docs/install/README.md), which
# writes deploy/.env and starts everything; afterwards `sudo deploy/hmis up` after a change.
# Backups: docs/backup/README.md. Disaster recovery: docs/backup/RESTORE.md.
name: hmis

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:-hmis}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-hmis}
  TZ: ${TZ:-Africa/Addis_Ababa}
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env}

x-app-build: &app-build
  context: ..
  dockerfile: deploy/app/Dockerfile

# The API connects as hmis_owner and hmis_app (set up by the "roles" service), never as the
# PostgreSQL superuser, whose password only the database and the backup worker get.
x-owner-url: &owner-url postgresql://hmis_owner:${HMIS_DB_OWNER_PASSWORD:?Set HMIS_DB_OWNER_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hmis}?schema=public

services:
  db:
    build: ./postgres
    image: hmis-postgres:17.11
    restart: unless-stopped
    shm_size: 256mb
    # The database holds only the encryption key it needs to archive WAL, never the off-site keys.
    environment: *database-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=hmis archive-push %p
      # A WAL segment is archived at least once a minute while the clinic is working:
      # the most that a dead disk can lose is about one minute of work.
      - -c
      - archive_timeout=60
    ports:
      # This server only (administration, e.g. through an SSH tunnel).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - ${BACKUP_DISK:-backup}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The owner and application roles (deploy/postgres/scripts/hmis-db-roles), before every start.
  roles:
    image: hmis-postgres:17.11
    command: [hmis-db-roles]
    user: postgres
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmis}
      POSTGRES_DB: ${POSTGRES_DB:-hmis}
      HMIS_DB_OWNER_PASSWORD: ${HMIS_DB_OWNER_PASSWORD:?Set HMIS_DB_OWNER_PASSWORD in .env}
      HMIS_DB_APP_PASSWORD: ${HMIS_DB_APP_PASSWORD:?Set HMIS_DB_APP_PASSWORD in .env}
    volumes:
      - pgsocket:/var/run/postgresql

  # Applies new migrations, as hmis_owner, before the API starts.
  migrate:
    build:
      <<: *app-build
      target: migrate
    image: hmis-migrate:${HMIS_VERSION:-local}
    restart: "no"
    depends_on:
      roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *owner-url

  api:
    build:
      <<: *app-build
      target: api
    image: hmis-api:${HMIS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Addis_Ababa}
      DATABASE_URL: *owner-url
      APP_DATABASE_URL: postgresql://hmis_app:${HMIS_DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-hmis}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Only HMIS's own containers are on this network, and only they can reach the API: the web
      # app and Caddy pass on the user's real address.
      TRUSTED_PROXIES: ${HMIS_SUBNET:-172.30.70.0/24}
      # Clinic server → cloud (docs/sync/README.md); empty on the cloud and stand-alone servers.
      SYNC_CLOUD_URL: ${SYNC_CLOUD_URL:-}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-5000}
      # The HMIS cloud: the platform console (/platform), the request page (/request) and
      # subscriptions. 0 on clinic servers.
      HMIS_PLATFORM: ${HMIS_PLATFORM:-0}
      # HMIS licences: "required" on clinic servers and own-server installs HMIS bills; the private
      # key only on the HMIS cloud, which issues them (docs/saas/README.md).
      HMIS_LICENCE: ${HMIS_LICENCE:-}
      HMIS_LICENCE_PRIVATE_KEY: ${HMIS_LICENCE_PRIVATE_KEY:-}
      HMIS_LICENCE_PUBLIC_KEY: ${HMIS_LICENCE_PUBLIC_KEY:-}
      # Online payment of subscriptions (docs/saas/README.md): the public address payers and the
      # providers come back to, and each provider's keys. Empty: that way of paying is off.
      HMIS_PUBLIC_URL: ${HMIS_PUBLIC_URL:-}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      TELEBIRR_API_URL: ${TELEBIRR_API_URL:-}
      TELEBIRR_WEB_URL: ${TELEBIRR_WEB_URL:-}
      TELEBIRR_FABRIC_APP_ID: ${TELEBIRR_FABRIC_APP_ID:-}
      TELEBIRR_APP_SECRET: ${TELEBIRR_APP_SECRET:-}
      TELEBIRR_MERCHANT_APP_ID: ${TELEBIRR_MERCHANT_APP_ID:-}
      TELEBIRR_MERCHANT_CODE: ${TELEBIRR_MERCHANT_CODE:-}
      TELEBIRR_PRIVATE_KEY: ${TELEBIRR_PRIVATE_KEY:-}
      TELEBIRR_PUBLIC_KEY: ${TELEBIRR_PUBLIC_KEY:-}

  web:
    build:
      <<: *app-build
      target: web
    image: hmis-web:${HMIS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Africa/Addis_Ababa}
      API_URL: http://api:4000

  # HTTPS: the only way in from the network (deploy/caddy/Caddyfile).
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      HMIS_SITE: "${HMIS_SITE:?Set HMIS_SITE in .env (the address people open, e.g. 192.168.1.10)}"
      HMIS_TLS: ${HMIS_TLS:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates, and on a clinic server its own certificate authority: back it up with
      # the keys (docs/install/README.md), or every PC must trust a new one after a reinstall.
      - caddy_data:/data
      - caddy_config:/config

  # Takes the backups, copies them off-site, tests restores, raises alerts.
  backup:
    image: hmis-postgres:17.11
    command: [hmis-backup, worker]
    user: postgres
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy
    env_file: ${BACKUP_ENV_FILE:-.env}
    environment: *database-env
    volumes:
      # Read-only: the backup worker can read the database files but never change them.
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
      - ${BACKUP_DISK:-backup}:/backup

  # Disaster recovery only (see docs/backup/RESTORE.md):
  #   docker compose run --rm restore hmis-backup restore --help
  restore:
    image: hmis-postgres:17.11
    profiles: [tools]
    user: postgres
    env_file: ${BACKUP_ENV_FILE:-.env}
    environment: *database-env
    command: [hmis-backup, restore, --help]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - ${BACKUP_DISK:-backup}:/backup

networks:
  default:
    ipam:
      config:
        # Change only if it clashes with the clinic's own network.
        - subnet: ${HMIS_SUBNET:-172.30.70.0/24}

volumes:
  pgdata:
  pgsocket:
  backup:
  caddy_data:
  caddy_config:
