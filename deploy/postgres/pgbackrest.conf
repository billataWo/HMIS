# pgBackRest settings for HMIS. Secrets never live here: the encryption key comes from the
# environment (PGBACKREST_REPO1_CIPHER_PASS) and environment variables override these values.
[global]
# Repository on the backup disk (a different physical disk from the database in production).
repo1-path=/backup/pgbackrest
# AES-256 encryption of every file in the repository (and therefore of the off-site copy too).
repo1-cipher-type=aes-256-cbc
# Keep enough full backups to restore to any moment in the last 14 days.
repo1-retention-full-type=time
repo1-retention-full=14
# Small files are bundled and incrementals store only changed blocks: smaller, faster off-site.
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-timeout=300
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[hmis]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
